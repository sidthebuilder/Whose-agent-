[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whoseagent"
version = "0.1.0"
description = "Whose agent is this? Attribute AI agent traffic in a web server log to the operator that declared it, and hand the evidence to a Switch room."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shashank Kumar" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
whoseagent = "whoseagent.cli:main"

[tool.setuptools]
packages = ["whoseagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
