<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rehearsal stand-in (not Switch)</title>
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f4f4f6; color: #222; }
  .banner { background: #b3261e; color: #fff; text-align: center; font-size: 15px; padding: 9px; letter-spacing: 0.02em; }
  .layout { display: grid; grid-template-columns: 220px 1fr; height: calc(100vh - 38px); }
  aside { background: #1e325c; color: #dfe6f3; padding: 18px; font-size: 14px; }
  aside b { display: block; margin-bottom: 14px; color: #fff; }
  main { display: flex; flex-direction: column; background: #fff; }
  header { padding: 14px 20px; border-bottom: 1px solid #e3e3e8; font-weight: 600; }
  #postListContent { flex: 1; overflow-y: auto; padding: 10px 20px; }
  .post { padding: 8px 0; border-bottom: 1px solid #f0f0f3; font-size: 15px; line-height: 1.45; }
  .post .who { font-weight: 600; }
  .box { padding: 14px 20px; border-top: 1px solid #e3e3e8; }
  #post_textbox { width: 100%; height: 48px; font: inherit; font-size: 15px; padding: 10px; border: 1px solid #c9c9d2; border-radius: 6px; resize: none; }
</style>
</head>
<body>
<div class="banner">REHEARSAL: a stand-in page for testing the demo recorder. Not Switch, not Mattermost. Every message here is canned.</div>
<div class="layout">
  <aside><b>Rehearsal</b># site-whose-agent</aside>
  <main>
    <header># site-whose-agent (rehearsal)</header>
    <div id="postListContent"></div>
    <div class="box"><textarea id="post_textbox" placeholder="Write to site-whose-agent"></textarea></div>
  </main>
</div>
<script>
  const list = document.getElementById("postListContent");
  const box = document.getElementById("post_textbox");
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  function post(who, html) {
    const d = document.createElement("div");
    d.className = "post";
    d.innerHTML = `<div class="who">${who}</div><div>${html}</div>`;
    list.appendChild(d);
    list.scrollTop = list.scrollHeight;
  }
  const later = (ms, f) => setTimeout(f, ms);
  // the recorder calls this instead of sending a real request through the tunnel
  window.rehearsalRequest = () => {
    later(1500, () => post("site-egress-check", "<b>Claimed, not declared</b> · claims GPTBot (OpenAI) · canned rehearsal text"));
    later(5000, () => post("site-abuse-writer", "Canned draft. Reply <code>approve 20990101-000000-L1</code> to approve it."));
  };
  box.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.shiftKey) return;
    e.preventDefault();
    const t = box.value.trim();
    if (!t) return;
    post("you", esc(t));
    box.value = "";
    if (/@site-egress-check/.test(t)) later(3000, () => post("site-egress-check", "Canned reply: registered to Microsoft Corporation."));
    if (/approve/.test(t)) later(2500, () => post("site-abuse-writer", "Canned reply: approved. Nothing was sent."));
  });
</script>
</body>
</html>
